{% extends 'lostfound/base.html' %}
{% block title %}Delete Item - Lost & Found{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm border-danger">
                <div class="card-body p-5 text-center">
                    <i class="bi bi-trash3-fill text-danger" style="font-size:3rem;"></i>
                    <h4 class="fw-bold mt-3 mb-2">Delete Item?</h4>
                    <p class="text-muted mb-4">Are you sure you want to remove <strong>"{{ item.title }}"</strong>? This action cannot be undone.</p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex gap-3 justify-content-center">
                            <a href="{% url 'item_detail' item.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger px-4 fw-bold">
                                <i class="bi bi-trash me-1"></i>Yes, Delete
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
